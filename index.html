<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Engine | Steampunk chronometer and sundial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="steampunk-theme">
    <div class="main-container">
        <header class="brass-header" onclick="playSteamhiss()" title="Click to release steam pressure">
            <h1 class="plate-title">CHRONO-ENGINE</h1>
            <p class="plate-subtitle">Victorian Precision Timekeeping & Solar Sundial</p>
        </header>
        <div class="mute-switch-container" onclick="toggleMute()" title="Click to toggle mechanical audio">
            <div class="switch-label">Acoustic Audio</div>
            <div class="knife-switch" id="knifeSwitch">
                <div class="switch-base"></div>
                <div class="switch-blade" id="switchBlade"></div>
                <div class="switch-handle"></div>
            </div>
            <div class="switch-status" id="switchStatus">ENGAGED</div>
        </div>
        <section class="chronometer-housing">
            <div class="gear-container">
                <svg class="gear gear-large cw" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="42" fill="none" stroke="var(--brass-primary)" stroke-width="12" stroke-dasharray="14 8"></circle>
                    <circle cx="50" cy="50" r="28" fill="var(--brass-dark)" stroke="var(--brass-primary)" stroke-width="3"></circle>
                    <circle cx="50" cy="50" r="10" fill="var(--panel-bg)" stroke="var(--brass-primary)" stroke-width="2"></circle>
                </svg>
                <svg class="gear gear-medium ccw" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="none" stroke="var(--copper)" stroke-width="12" stroke-dasharray="14 8"></circle>
                    <circle cx="50" cy="50" r="25" fill="var(--brass-dark)" stroke="var(--copper)" stroke-width="3"></circle>
                    <circle cx="50" cy="50" r="8" fill="var(--panel-bg)" stroke="var(--copper)" stroke-width="2"></circle>
                </svg>
                <svg class="gear gear-small cw" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="38" fill="none" stroke="var(--brass-primary)" stroke-width="16" stroke-dasharray="10 5"></circle>
                    <circle cx="50" cy="50" r="20" fill="var(--brass-dark)" stroke="var(--brass-primary)" stroke-width="3"></circle>
                    <circle cx="50" cy="50" r="6" fill="var(--panel-bg)" stroke="var(--brass-primary)" stroke-width="2"></circle>
                </svg>
            </div>
            <div class="clock-face" id="clockFace">
                <div class="center-cap"></div>
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="hand second-hand" id="secondHand"></div>
            </div>
            <div class="readout-panel">
                <div class="digital-time" id="digitalTime">00:00:00</div>
                <div class="antique-date" id="antiqueDate">Calculating epoch...</div>
            </div>
        </section>
        <section class="sundial-section">
            <div class="section-title">
                <h2>Solar Sundial & Gnomon Shadow</h2>
            </div>
            <div class="sundial-plate" id="sundialPlate">
                <div class="gnomon"></div>
                <div class="shadow-cast" id="gnomonShadow"></div>
                <div class="sundial-marking s-12">XII</div>
                <div class="sundial-marking s-3">III</div>
                <div class="sundial-marking s-6">VI</div>
                <div class="sundial-marking s-9">IX</div>
            </div>
        </section>
        <section class="pressure-section">
            <div class="section-title">
                <h2>Boiler Pressure Manometer</h2>
            </div>
            <div class="gauge-container" onclick="releasePressure()" title="Click to vent steam pressure">
                <div class="gauge-face">
                    <div class="gauge-needle" id="gaugeNeedle"></div>
                    <div class="gauge-center"></div>
                </div>
            </div>
            <div class="gauge-status" id="gaugeStatus">Pressure Stable</div>
        </section>
    </div>
    <script src="app.js"></script>    
</body>
</html>
